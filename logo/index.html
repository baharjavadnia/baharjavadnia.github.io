<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo concepts, Bahar Javadnia</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F2F2F5; --card: #FFFFFF; --ink: #1B1B22; --muted: #696977; --line: #E3E3EA;
  --mark: #4A45C4; --node: #C9643F; --dark: #16161B; --dark-mark: #8E89FF; --dark-node: #E4876A;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 1200px; margin: 0 auto; padding: 48px 16px 80px; }
h1 { font: 600 32px/1.1 "Inter Tight", sans-serif; letter-spacing: -0.02em; margin: 0 0 8px; }
.intro { color: var(--muted); margin: 0 0 32px; max-width: 60ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
.c { background: var(--card); border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 20px rgba(0,0,0,.05); overflow: hidden; position: relative; }
.c.pick { outline: 2px solid var(--mark); }
.c .tag { position: absolute; top: 12px; right: 12px; font-size: 12px; font-weight: 600; color: #fff; background: var(--mark); padding: 3px 9px; border-radius: 999px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; }
.tile { aspect-ratio: 1; display: grid; place-items: center; color: var(--mark); --n: var(--node); --b: var(--card); }
.tile.dark { background: var(--dark); color: var(--dark-mark); --n: var(--dark-node); --b: var(--dark); }
.tile svg { width: 58%; height: 58%; }
.body { padding: 16px 18px 18px; border-top: 1px solid var(--line); }
.body h2 { font: 600 18px/1.2 "Inter Tight", sans-serif; margin: 0 0 4px; letter-spacing: -0.01em; }
.body p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.sizes { display: flex; align-items: center; gap: 14px; color: var(--mark); --n: var(--node); --b: var(--card); }
.sizes svg { flex: 0 0 auto; }
.fav { width: 32px; height: 32px; border-radius: 8px; background: var(--mark); color: #fff; display: grid; place-items: center; --n: #FFB59C; --b: var(--mark); }
.fav svg { width: 24px; height: 24px; }
.fav.s16 { width: 16px; height: 16px; border-radius: 4px; }
.fav.s16 svg { width: 13px; height: 13px; }
.bar { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 13.5px; font-weight: 600; color: var(--ink); background: var(--bg); padding: 7px 12px 7px 9px; border-radius: 8px; }
.bar svg { width: 24px; height: 24px; color: var(--mark); }
.word { margin-top: 40px; background: var(--card); border-radius: 10px; padding: 32px; display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: center; }
.lock { display: flex; align-items: center; gap: 14px; color: var(--mark); --n: var(--node); --b: var(--card); }
.lock svg { width: 56px; height: 56px; }
.lock b { font: 600 30px/1 "Inter Tight", sans-serif; letter-spacing: -0.03em; color: var(--ink); }
.lock.dark { background: var(--dark); padding: 18px 22px; border-radius: 10px; color: var(--dark-mark); --n: var(--dark-node); --b: var(--dark); }
.lock.dark b { color: #ECECF2; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="m-fork" viewBox="0 0 64 64">
    <g transform="translate(1.5 1.5)">
      <g fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M27 54 V22"/><path d="M27 54 H38 A11 11 0 0 0 38 32 H27"/><path d="M27 22 L17 12"/><path d="M27 22 L37 12"/>
      </g>
      <circle cx="14" cy="9" r="5" fill="var(--n)"/><circle cx="40" cy="9" r="5" fill="currentColor"/>
    </g>
  </symbol>
  <symbol id="m-sprout" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 10 V43"/><circle cx="39" cy="43" r="11"/><path d="M28 26 C28 18 23 14 15 13"/>
    </g>
    <circle cx="11" cy="13" r="5.75" fill="var(--n)"/>
  </symbol>
  <symbol id="m-node" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 10 V54"/><path d="M18 10 H32 A11 11 0 0 1 32 32 H18"/><path d="M18 32 H35 A11 11 0 0 1 35 54 H18"/>
    </g>
    <circle cx="18" cy="10" r="5.5" fill="var(--b)" stroke="currentColor" stroke-width="3.5"/>
    <circle cx="18" cy="54" r="5.5" fill="var(--b)" stroke="currentColor" stroke-width="3.5"/>
    <circle cx="18" cy="32" r="6" fill="var(--n)"/>
  </symbol>
  <symbol id="m-be" viewBox="0 0 64 64">
    <path d="M52 14 V25 C52 34 46 39 37 39 H25 C16 39 11 34 11 26" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="31.5" cy="51" r="5.75" fill="var(--n)"/>
  </symbol>
  <symbol id="m-bloom" viewBox="0 0 64 64">
    <g fill="currentColor" fill-opacity=".55">
      <circle cx="32" cy="19" r="12"/><circle cx="44.4" cy="28" r="12"/><circle cx="39.6" cy="42.5" r="12"/><circle cx="24.4" cy="42.5" r="12"/><circle cx="19.6" cy="28" r="12"/>
    </g>
    <circle cx="32" cy="32" r="6" fill="var(--n)" stroke="var(--b)" stroke-width="2.5"/>
  </symbol>
  <symbol id="m-bud" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 16 V43"/><circle cx="35" cy="43" r="11"/>
    </g>
    <circle cx="24" cy="9" r="6.25" fill="var(--n)"/>
  </symbol>
</svg>

<main>
  <h1>Logo concepts</h1>
  <p class="intro">Bahar means spring. The work is decision trees, agent flows and design systems. Each mark joins the initial with growth or branching. The indigo is the portfolio's; the coral node is the agent's colour from the site.</p>

  <div class="grid" id="grid"></div>

  <div class="word" aria-label="Lockups">
    <div class="lock"><svg><use href="#m-fork"/></svg><b>bahar javadnia</b></div>
    <div class="lock dark"><svg><use href="#m-fork"/></svg><b>bahar javadnia</b></div>
  </div>
</main>

<script>
var concepts = [
  ['m-fork', 'Forked b', 'A lowercase b whose stem splits into two choices, the chosen one in coral. b for Bahar, a fork for every decision, a sprout for spring.', true],
  ['m-sprout', 'Sprout b', 'A b with a single sprout leaning away from the bowl, ending in a bud. Softer and more organic.'],
  ['m-node', 'Node B', 'A capital B drawn as a flow graph. Its corners are nodes and the middle one is active.'],
  ['m-be', 'Be', 'The Persian letter that starts بهار: a bowl with its dot below. Personal, and unlike any other mark.'],
  ['m-bloom', 'Bloom', 'Five petals for spring. The overlaps build depth, with a node at the heart.'],
  ['m-bud', 'Bud b', 'The plainest b, with a bud for the ascender. Quiet and very legible.']
];
var g = document.getElementById('grid');
concepts.forEach(function (c, i) {
  var id = c[0];
  var el = document.createElement('article');
  el.className = 'c' + (c[3] ? ' pick' : '');
  el.innerHTML =
    (c[3] ? '<span class="tag">Recommended</span>' : '') +
    '<div class="tiles"><div class="tile"><svg><use href="#' + id + '"/></svg></div><div class="tile dark"><svg><use href="#' + id + '"/></svg></div></div>' +
    '<div class="body"><h2>' + (i + 1) + '. ' + c[1] + '</h2><p>' + c[2] + '</p>' +
    '<div class="sizes"><svg width="48" height="48"><use href="#' + id + '"/></svg><svg width="24" height="24"><use href="#' + id + '"/></svg>' +
    '<span class="fav"><svg><use href="#' + id + '"/></svg></span><span class="fav s16"><svg><use href="#' + id + '"/></svg></span>' +
    '<span class="bar"><svg><use href="#' + id + '"/></svg>Bahar Javadnia</span></div></div>';
  g.appendChild(el);
});
</script>
</body>
</html>
